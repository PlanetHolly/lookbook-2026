<div id="box" onclick="this.classList.remove('show')"><img id="boxImg" src="" alt="">
<div class="cap"><b id="boxName"></b><span id="boxDesc"></span></div></div>
<footer><b>Like something you see?</b> Every piece in this book was decorated by our team. Send us your idea and we will make it real.</footer>
<script>
let group='All', cat=null;
const cards=[...document.querySelectorAll('.card')];
function apply() {
  let n=0;
  cards.forEach(c => {
    const okG = group==='All' ? true : c.dataset.group===group;
    const okC = !cat || c.dataset.cat===cat;
    c.classList.toggle('hide', !(okG&&okC)); if(okG&&okC) n++;
  });
  document.getElementById('count').textContent = n + ' pieces';
  document.querySelectorAll('.chip').forEach(ch => {
    ch.style.display = (group!=='All' && ch.dataset.group===group) ? '' : 'none';
    ch.classList.toggle('on', ch.dataset.cat===cat);
  });
  document.getElementById('chips').classList.toggle('show', group!=='All');
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  group=t.dataset.group; cat=null;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); apply();
});
document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { cat = (cat===ch.dataset.cat? null : ch.dataset.cat); apply(); });
function openBox(c) {
  document.getElementById('boxImg').src=c.dataset.img;
  document.getElementById('boxName').textContent=c.dataset.name;
  document.getElementById('boxDesc').textContent=c.dataset.desc;
  document.getElementById('box').classList.add('show');
}
apply();
</script></body></html>
